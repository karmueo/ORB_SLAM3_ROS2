%YAML:1.0

# Generated by prepare-ego-stereo-inertial-config.
# Calibration: calib.yaml
# Bag: job_002.mcap
# Input images are the original stitched side-by-side EGO frames; no rectification,
# downsampling or frame dropping is configured here.

File.version: "1.0"

# Native fisheye Kannala-Brandt model; BOOL_RECTIFY=false.
Camera.type: "KannalaBrandt8"

# Left camera (cam0).
Camera1.fx: 682.0539920133708
Camera1.fy: 682.3327235394054
Camera1.cx: 976.7157606046939
Camera1.cy: 550.2659094669332
Camera1.k1: 0.3966402368796761
Camera1.k2: 0.18311725738817283
Camera1.k3: -0.20432628115126497
Camera1.k4: 0.11014047407355965

# Right camera (cam1), using its own independent fisheye calibration.
Camera2.fx: 678.8759785509483
Camera2.fy: 679.1784954472535
Camera2.cx: 989.1676113493628
Camera2.cy: 513.1845551578026
Camera2.k1: 0.3983529379855351
Camera2.k2: 0.1704791309633979
Camera2.k3: -0.1881098669606969
Camera2.k4: 0.10218292444234162

Camera.width: 1920
Camera.height: 1080
# Measured from 4909 image headers over 81.800044465 s.
Camera.fps: 60
Camera.RGB: 0

# Full-width stereo lapping areas: each half is an independent fisheye image.
Camera1.overlappingBegin: 0
Camera1.overlappingEnd: 1919
Camera2.overlappingBegin: 0
Camera2.overlappingEnd: 1919

# ThDepth is in baseline units; this is the ORB_SLAM3 close/far threshold.
Stereo.ThDepth: 40.0

# T_c1_c2 is the inverse of calib.yaml T_cam1_cam0 (left->right), translation in metres.
Stereo.T_c1_c2: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [0.9999150059384407, -0.0008947342836839433, -0.013006934676901971, 0.09934859980656081,
          0.0011221950975082717, 0.9998463929145828, 0.017490890596588766, 0.00014117127449788955,
          0.012989287020107128, -0.017504000293084652, 0.9997624159751402, 3.732638891081253e-05,
          0.0, 0.0, 0.0, 1.0]

# T_b_c1 is the inverse of cam0 T_cam_imu (IMU->camera), translation in metres.
# This key is the left-camera to body/IMU transform expected by ORB_SLAM3.
IMU.T_b_c1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [0.9999979565844915, -0.0016545109967146616, 0.0011616454721144623, -0.044295379794570114,
          -0.001650976800331169, -0.9999940260400599, -0.003036800915043577, 0.0007642292871510052,
          0.0011666629529997169, 0.0030348768598728146, -0.9999947141960297, -0.00406272195221067,
          0.0, 0.0, 0.0, 1.0]

IMU.InsertKFsWhenLost: 0
# Deferred reset switches are intentionally left at the upstream default (off).

# Noise values are copied from calib.yaml without applying another scale factor.
IMU.NoiseGyro: 0.0010096525178692722
IMU.NoiseAcc: 0.006695169669864
IMU.GyroWalk: 0.0002516215139079196
IMU.AccWalk: 0.003082242979633672
# Measured from 65856 IMU headers over 81.781425477 s.
IMU.Frequency: 805.2562010981442

# Fixed biases for the offline reader to subtract before passing IMU samples
# to ORB_SLAM3. Accel is m/s^2; gyro is rad/s (converted from deg/s).
IMU.AccBias: [-0.029434063594039692, -0.059572970438788175, -0.41126879390313076]
IMU.GyroBias: [0.01458150489745394, 0.007169294776063767, 0.0015831780213037634]

# corrected_imu_t = raw_imu_t + ROS.ImuTimeOffsetSec
ROS.ImuTimeOffsetSec: -0.005089461604383672

ORBextractor.nFeatures: 1200
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -3.5
Viewer.ViewpointF: 500.0
