%YAML:1.0

# EGO job_004 最终离线双目惯性运行配置。
# 由 prepare-ego-stereo-inertial-config 从原 calib.yaml 和原 MCAP 生成，并只在
# 完整包日志有证据时调整 ORB 特征数和两个“延迟 reset”运行开关。
# 输入保持原分辨率 1920x1080/眼、全部 3234 帧、原生 Kannala-Brandt 鱼眼。
# ROS.ImuTimeOffsetSec 保留标定原值；最终运行用 --imu-time-offset-sec 显式覆盖。
#
# Generated by prepare-ego-stereo-inertial-config.
# Calibration: calib.yaml
# Bag: job_004.mcap
# Input images are the original stitched side-by-side EGO frames; no rectification,
# downsampling or frame dropping is configured here.

File.version: "1.0"

# Native fisheye Kannala-Brandt model; BOOL_RECTIFY=false.
Camera.type: "KannalaBrandt8"

# Left camera (cam0).
Camera1.fx: 675.3400977838689
Camera1.fy: 675.0669178087476
Camera1.cx: 945.3365631063257
Camera1.cy: 568.4698921303237
Camera1.k1: 0.39371303768602134
Camera1.k2: 0.15071624229947425
Camera1.k3: -0.13782997983842898
Camera1.k4: 0.07147440566690481

# Right camera (cam1), using its own independent fisheye calibration.
Camera2.fx: 676.6309509962041
Camera2.fy: 676.3942903544906
Camera2.cx: 955.1602489815064
Camera2.cy: 518.0650072693021
Camera2.k1: 0.3966202570429266
Camera2.k2: 0.1518394466103733
Camera2.k3: -0.14508889529604302
Camera2.k4: 0.07765365551334684

Camera.width: 1920
Camera.height: 1080
# Measured from 3234 image headers over 64.829084444 s.
Camera.fps: 50
Camera.RGB: 0

# Full-width stereo lapping areas: each half is an independent fisheye image.
Camera1.overlappingBegin: 0
Camera1.overlappingEnd: 1919
Camera2.overlappingBegin: 0
Camera2.overlappingEnd: 1919

# ThDepth is in baseline units; this is the ORB_SLAM3 close/far threshold.
Stereo.ThDepth: 40.0

# T_c1_c2 is the inverse of calib.yaml T_cam1_cam0 (left->right), translation in metres.
Stereo.T_c1_c2: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [0.9999706606923904, -0.007579278777093617, -0.0011100845209613445, 0.09902548357291298,
          0.007560290524671534, 0.999839985264865, -0.01621252209677075, -0.00013463752691010984,
          0.0012327861157319661, 0.016203653871112375, 0.9998679522014988, 0.00035165542701666826,
          0.0, 0.0, 0.0, 1.0]

# T_b_c1 is the inverse of cam0 T_cam_imu (IMU->camera), translation in metres.
# This key is the left-camera to body/IMU transform expected by ORB_SLAM3.
IMU.T_b_c1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [0.9999916273826187, -0.00403571535894397, 0.0006768797560419855, -0.0452011029122949,
          -0.004032654557744824, -0.9999819053727363, -0.004463924767519988, 0.0025308531669572397,
          0.000694882637900548, 0.004461157770552644, -0.9999898075527899, -0.019424894800357355,
          0.0, 0.0, 0.0, 1.0]

IMU.InsertKFsWhenLost: 0
# 本包在 IMU 已初始化但 BA2 前的低运动阶段会触发上游默认 active-map reset，
# 导致 10 个关键帧的惯性初始化窗口被反复切断。Defer* 只延迟该 reset；持续
# 跟踪失败仍允许建新图，不关闭重置机制。完整运行日志见 results/ego_job_004/。

# Noise values are copied from calib.yaml without applying another scale factor.
IMU.NoiseGyro: 0.0010096525178692722
IMU.NoiseAcc: 0.006695169669864
IMU.GyroWalk: 0.0002516215139079196
IMU.AccWalk: 0.003082242979633672
# Measured from 26308 IMU headers over 64.857133298 s.
IMU.Frequency: 405.6145972275224

# Fixed biases for the offline reader to subtract before passing IMU samples
# to ORB_SLAM3. Accel is m/s^2; gyro is rad/s (converted from deg/s).
IMU.AccBias: [0.3940591850757028, -0.21056769832549982, -0.4209784554965755]
IMU.GyroBias: [0.0013824328721259607, 0.03306316069887306, 0.018110457745926737]

# corrected_imu_t = raw_imu_t + ROS.ImuTimeOffsetSec
ROS.ImuTimeOffsetSec: -0.005089461604383672

# 鱼眼双目 StereoInitialization 的 N>500 检查左右目检测特征数之和，
# 不是三角化后的地图点数；本配置完整包初始化时建立约 286 个地图点。
# 1200 特征且 fastInit/Defer 开关关闭时，在 +0.0267 秒也达到 3103/3234；
# 该运行的偏移和开关与本配置不同，不能把覆盖差异单独归因于特征数。
ORBextractor.nFeatures: 3000
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -3.5
Viewer.ViewpointF: 500.0

# 默认 StereoInitialization 要求相邻帧平均加速度差 >=0.5 m/s^2；本包低动态
# 段长期不满足。启用 fastInit 只跳过该门限，仍保留 N>500 和 IMU 数据检查。
IMU.fastInit: 1

# 只延后低运动清图和 IMU 已初始化但 BA2 前短暂 lost 的 reset。
IMU.DeferLowMotionReset: 1
IMU.DeferPreBA2TrackingReset: 1
