%YAML:1.0

#--------------------------------------------------------------------------------------------
# XV RGB 鱼眼单目惯性 bag4 轻量包配置。
# 基于 XV_RGB_Fisheye_calibrated_resize.yaml，适配 /mnt/data/slam/my_umi_rosbag/4_light_*_960。
#--------------------------------------------------------------------------------------------
# 配置文件格式版本，ORB-SLAM3 用于识别当前 YAML 配置格式。
File.version: "1.0"

# 相机模型类型；XV RGB 鱼眼相机使用 ORB-SLAM3 的 Kannala-Brandt 鱼眼模型。
Camera.type: "KannalaBrandt8"

# 相机 x 方向焦距 fx，单位为像素；来自 Kalibr intrinsics 的第 1 个值。
Camera1.fx: 396.0595565986293
# 相机 y 方向焦距 fy，单位为像素；来自 Kalibr intrinsics 的第 2 个值。
Camera1.fy: 395.85243766764546
# 主点 x 坐标 cx，单位为像素；来自 Kalibr intrinsics 的第 3 个值。
Camera1.cx: 636.5742541685161
# 主点 y 坐标 cy，单位为像素；来自 Kalibr intrinsics 的第 4 个值。
Camera1.cy: 642.5331509623186

# 鱼眼畸变参数 k1；来自 Kalibr equidistant distortion_coeffs 的第 1 个值。
Camera1.k1: 0.07912234666957998
# 鱼眼畸变参数 k2；来自 Kalibr equidistant distortion_coeffs 的第 2 个值。
Camera1.k2: -0.00781520757662664
# 鱼眼畸变参数 k3；来自 Kalibr equidistant distortion_coeffs 的第 3 个值。
Camera1.k3: -0.005298686138242286
# 鱼眼畸变参数 k4；来自 Kalibr equidistant distortion_coeffs 的第 4 个值。
Camera1.k4: 0.00035743420516503726

# 图像宽度，单位为像素；与 Kalibr resolution 和 XV RGB 图像输出一致。
Camera.width: 1280
# 图像高度，单位为像素；与 Kalibr resolution 和 XV RGB 图像输出一致。
Camera.height: 1280
# ORB-SLAM3 内部处理图像宽度，单位为像素；用于降低 1280x1280 输入的实时计算负载。
Camera.newWidth: 960
# ORB-SLAM3 内部处理图像高度，单位为像素；保持与原图相同宽高比，内部会同步缩放相机内参。
Camera.newHeight: 960
# 图像帧率，单位为 Hz；bag4 轻量包实测图像中位频率约为 60Hz。
Camera.fps: 60

# 图像颜色通道顺序标志；当前 /rgb/image 使用 bgr8 编码，因此填写 0。
Camera.RGB: 0

# 机体系（IMU）到相机系的外参。
# Kalibr 输出 T_cam_imu 表示 imu0 到 cam0，语义与 IMU.T_b_c1 一致，直接写入。
IMU.T_b_c1: !!opencv-matrix
   # 外参矩阵行数，固定为 4。
   rows: 4
   # 外参矩阵列数，固定为 4。
   cols: 4
   # OpenCV 矩阵元素类型；f 表示 32 位浮点数。
   dt: f
   # 4x4 齐次变换矩阵，按行展开；前三行是旋转和平移，最后一行为 [0, 0, 0, 1]。
   data: [0.9998600089729606, -0.0076143071594048034, 0.014899153770374108, 0.021860385518540318,
          0.0077452218522750015, 0.9999317323797406, -0.008748835265888629, -0.011696915247243657,
          -0.014831520321600818, 0.008863007758817066, 0.9998507254077565, -0.02367157192605903,
          0.0, 0.0, 0.0, 1.0]

# 跟踪丢失时是否强制插入关键帧；当前保持 0，使用 ORB-SLAM3 默认惯性初始化行为。
IMU.InsertKFsWhenLost: 0

# 陀螺仪白噪声密度，单位为 rad/s/sqrt(Hz)；来自 Allan gyroscope_noise_density。
IMU.NoiseGyro: 0.00013340717339568767
# 加速度计白噪声密度，单位为 m/s^2/sqrt(Hz)；来自 Allan accelerometer_noise_density。
IMU.NoiseAcc: 0.011362633638908732
# 陀螺仪随机游走，单位按 ORB-SLAM3/Kalibr IMU 模型使用；来自 Allan gyroscope_random_walk。
IMU.GyroWalk: 4.905584115261025e-06
# 加速度计随机游走，单位按 ORB-SLAM3/Kalibr IMU 模型使用；来自 Allan accelerometer_random_walk。
IMU.AccWalk: 0.0003604781951727939
# IMU 发布频率，单位为 Hz；bag4 轻量包实测 IMU 中位频率约为 493.34Hz，保持原配置 493.2。
IMU.Frequency: 493.2

#--------------------------------------------------------------------------------------------
# ORB Parameters.
#--------------------------------------------------------------------------------------------
# 每帧提取的 ORB 特征点数量；保持 800 以减少特征提取和匹配开销。
ORBextractor.nFeatures: 800
# 图像金字塔相邻层缩放因子；当前保持 ORB-SLAM3 常用值 1.2。
ORBextractor.scaleFactor: 1.2
# 图像金字塔层数；当前保持模板值 8。
ORBextractor.nLevels: 8
# FAST 初始阈值；提高阈值可减少弱角点数量并降低计算压力。
ORBextractor.iniThFAST: 25
# FAST 最小阈值；初始阈值提取不足时使用该阈值补充特征。
ORBextractor.minThFAST: 10

#--------------------------------------------------------------------------------------------
# Viewer Parameters.
#--------------------------------------------------------------------------------------------
# Pangolin viewer 中关键帧相机模型的显示尺寸。
Viewer.KeyFrameSize: 0.05
# Pangolin viewer 中关键帧相机模型线宽。
Viewer.KeyFrameLineWidth: 1.0
# Pangolin viewer 中共视图/图优化连线宽度。
Viewer.GraphLineWidth: 0.9
# Pangolin viewer 中地图点显示大小。
Viewer.PointSize: 2.0
# Pangolin viewer 中当前相机模型的显示尺寸。
Viewer.CameraSize: 0.08
# Pangolin viewer 中当前相机模型线宽。
Viewer.CameraLineWidth: 3.0
# Pangolin viewer 初始观察位置 x 坐标。
Viewer.ViewpointX: 0.0
# Pangolin viewer 初始观察位置 y 坐标。
Viewer.ViewpointY: -0.7
# Pangolin viewer 初始观察位置 z 坐标。
Viewer.ViewpointZ: -3.5
# Pangolin viewer 初始观察焦距参数。
Viewer.ViewpointF: 500.0
# Pangolin viewer 图像显示缩放比例；bag4 轻量包 viewer=true 时降低当前帧显示开销。
Viewer.imageViewScale: 0.5
