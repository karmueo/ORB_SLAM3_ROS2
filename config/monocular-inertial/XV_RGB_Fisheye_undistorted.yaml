%YAML:1.0

#--------------------------------------------------------------------------------------------
# XV RGB 鱼眼校正图像单目惯性配置。
# 适配 xv_sdk_ros2 发布的 rgb_fisheye_undistorted/image；图像已由 SDK 使用 Kalibr
# equidistant 参数校正为理想针孔图像，ORB-SLAM3 不再执行鱼眼去畸变。
#--------------------------------------------------------------------------------------------
File.version: "1.0"

#--------------------------------------------------------------------------------------------
# Camera Parameters.
#--------------------------------------------------------------------------------------------
# SDK 校正输出使用原 Kalibr 内参作为新针孔内参。
Camera.type: "PinHole"

Camera1.fx: 397.07575683833136
Camera1.fy: 397.07575683833136
Camera1.cx: 637.7723482481603
Camera1.cy: 640.0889202000565

# Camera1.k1/k2/p1/p2 有意省略；当前 ORB-SLAM3 Settings 以字段缺失表示输入已经无畸变。
Camera.width: 1280
Camera.height: 1280
Camera.newWidth: 960
Camera.newHeight: 960
Camera.fps: 30

# xv_sdk_ros2 的校正图像编码为 rgb8；wrapper 会按消息编码正确转换为灰度图。
Camera.RGB: 1

#--------------------------------------------------------------------------------------------
# ROS Wrapper Parameters.
#--------------------------------------------------------------------------------------------
# Kalibr 定义 t_imu = t_cam + shift；wrapper 对 IMU 时间戳加本字段，故使用相反数。
ROS.ImuTimeOffsetSec: -0.005089461604383672
# 图像与 IMU 的 header.stamp 必须由设备发布端统一时基；wrapper 检测到差值超过 1 秒时退出。
# 实时链路主动限制为 30 Hz，降低校正和特征提取并行运行时的积压风险。
ROS.TargetFps: 30
# 只保留少量待处理图像，使实时跟踪优先使用较新帧。
ROS.MaxImageQueueSize: 2
# 吸收 IMU 回调并发导致的小幅到达乱序。
ROS.ImuReorderWindowSec: 0.01

#--------------------------------------------------------------------------------------------
# IMU Parameters.
#--------------------------------------------------------------------------------------------
# ORB-SLAM3 的 IMU.T_b_c1 使用相机系到机体系的 T_b_c。
# 以下矩阵是 SDK 校正文件 T_cam_imu 的逆；校正只改变像素投影，不改变相机坐标系。
IMU.T_b_c1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [0.999729781341468, 0.00969564125634819, -0.0211272061467728, -0.0200285583895465,
          -0.0092884083006446, 0.99977080554486, 0.0192889048787812, 0.0107219204777111,
          0.0213093822102039, -0.0190874545398372, 0.999590705893672, 0.0204154259017981,
          0.0, 0.0, 0.0, 1.0]

IMU.InsertKFsWhenLost: 0
IMU.DeferLowMotionReset: 1

IMU.NoiseGyro: 0.00013340717339568767
IMU.NoiseAcc: 0.011362633638908732
IMU.GyroWalk: 4.905584115261025e-06
IMU.AccWalk: 0.0003604781951727939
IMU.Frequency: 493.3

#--------------------------------------------------------------------------------------------
# ORB Parameters.
#--------------------------------------------------------------------------------------------
ORBextractor.nFeatures: 1200
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Viewer Parameters.
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -3.5
Viewer.ViewpointF: 500.0
Viewer.imageViewScale: 2.0
